# NEW_CAR — registrul surselor
#
# POPULAT 2026-08-19 din primul scan real (47 surse încercate, 29 modele).
# Acest fişier este ce face diferenţa dintre un scan de descoperire (scump) şi
# un scan de actualizare (ieftin). Descoperirea s-a făcut o dată. Scanul lunar
# citeşte de aici şi NU mai caută.

version: 2
updated: 2026-08-19
populat_din: scan-2026-08-19

# ===========================================================================
# NIVELURI DE ÎNCREDERE
# ===========================================================================
trust_levels:
  1_lista_pret_oficiala:
    descriere: "lista de preţuri PDF a importatorului"
    confidence_implicit: confirmed
    acopera: [pret_lista, motorizari, garantie, dimensiuni]
    NU_acopera: [dotari_pe_niveluri]

  1b_brosura_tehnica:
    descriere: "broşura tehnică cu tabelul complet de dotări pe niveluri"
    confidence_implicit: confirmed
    acopera: [dotari_pe_niveluri, echipare_selectata, optiuni_si_pachete]
    rol: "sursă autoritativă pentru pragul de dotări"

  2_dealer_lista_pret:
    descriere: "lista de preţuri publicată de un dealer (adesea mai recentă decât cea a importatorului)"
    confidence_implicit: confirmed
    nota: "auto-net.ro, serus-*.ro şi metrotehnica.ro s-au dovedit sistematic
           mai actuale şi mai complete decât paginile importatorilor"

  2b_landing_campanie:
    descriere: "pagina de campanie a unui dealer"
    confidence_implicit: confirmed
    acopera: [pret_promotional, tip_reducere, conditii_oferta]
    de_ce_separat: "listingul de stoc al unui dealer NU conţine campaniile lui"

  3_agregator:
    confidence_implicit: derived
    acopera: [descoperire_oferte]
    nota: "anunţurile autovit.ro expiră şi returnează 410 — nu se salvează ca surse stabile"

  4_presa_teste:
    confidence_implicit: estimated
    acopera: [consum_real, dimensiuni_cand_lipsesc_oficial]
    nota: "NICIODATĂ pentru preţ"

