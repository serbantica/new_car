# ===========================================================================
# PROCEDURA DE SCAN LUNAR — ieftin prin construcţie
# ===========================================================================
procedura_scan_lunar:
  principiu: "Scanul lunar ACTUALIZEAZĂ, nu descoperă. Catalogul tehnic
              (data/models.json) NU se reverifică."

  ce_NU_face:
    - "NU foloseşte subagenţi. Ei au fost instrumentul potrivit pentru
       descoperire paralelă pe 30 de modele necunoscute; sunt instrumentul
       greşit pentru a citi 30 de URL-uri cunoscute."
    - "NU face WebSearch decât dacă un URL din registru a murit."
    - "NU reverifică lungimi, motorizări, cupluri, garanţii sau matricea de
       dotări. Sunt în models.json."
    - "NU reîncearcă nimic din lista neagră."

  ce_face:
    - "Pentru fiecare sursă validată: un WebFetch cu întrebare ÎNGUSTĂ —
       'care e preţul pentru <echipare> <motorizare> <cutie>? ce reduceri
       sunt listate şi cu ce valoare? până când e valabilă oferta?'"
    - "Compară cu scanul precedent. Raportează DOAR delta peste pragul din
       criteria.yaml (3%)."
    - "Când o sursă returnează eroare de 3 ori consecutiv, o mută în lista
       neagră şi caută UN înlocuitor — o singură dată, nu la fiecare rulare."

  buget_estimat: "~30 apeluri WebFetch cu prompt scurt. Sub 10% din costul
                  scanului de descoperire din 2026-08-19."

  rulare: "sarcină programată, în sesiune nouă. NU într-o conversaţie lungă —
           fiecare apel de tool reprocesează tot istoricul acumulat, ceea ce
           a fost al doilea consumator ca mărime în sesiunea de descoperire."

# ===========================================================================
# REGULI DE INTERPRETARE
# ===========================================================================
reguli:
  - "VÂRSTA SURSEI ESTE UN CÂMP, NU O PRESUPUNERE. Peste 12 luni →
     confidence=estimated automat. Confirmate: ford.ro 2020, suzuki.ro 2024,
     mtrgroup.ro MY23, apancars.ro 2024."
  - "NU SE PRESUPUNE CĂ UN PREŢ AFIŞAT E PREŢ DE LISTĂ. dacia.ro şi
     vanzari.dacia.ro publică direct net promoţional."
  - "REDUCERILE SE CLASIFICĂ DUPĂ VALOARE, NU DUPĂ NUME. Grila 2026:
     1.907 EUR benzină, 2.288 EUR hibrid. Testul a funcţionat 11 din 11."
  - "REDUCERILE CONDIŢIONATE DE FINANŢARE CAPTIVĂ SAU ASIGURARE NU INTRĂ ÎN
     NET. Grupul VW e cazul extrem: 5.400-5.800 EUR condiţionaţi."
  - "O extragere implauzibilă dintr-un PDF este, prima dată, o întrebare prost
     pusă — nu o sursă proastă. Cere citate EXACTE şi permite explicit
     răspunsul 'nu apare în document'. Reîntreabă înainte să schimbi sursa."
  - "Când două surse se contrazic, păstrează ambele valori cu sursele lor şi
     marchează conflictul. Nu alege tăcut."
